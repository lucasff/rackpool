name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  DESCRIPTION: "Encrypted, erasure-coded shared media pool: mp-node (default), mp-coord and the mp CLI"

jobs:
  image:
    name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }} image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
          # Multi-arch images show the index annotation on the package page;
          # the label covers single-arch pulls and `docker inspect`.
          labels: |
            org.opencontainers.image.title=rackpool
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
          annotations: |
            org.opencontainers.image.title=rackpool
            org.opencontainers.image.description=${{ env.DESCRIPTION }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-demo:
    name: Compose demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run scripts/compose-demo.sh
        shell: bash
        run: |
          bash scripts/compose-demo.sh 2>&1 | tee compose-demo-output.txt
          grep -qx 'OK: identical' compose-demo-output.txt
          grep -qx 'OK: identical after drain' compose-demo-output.txt
      - name: Compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.pool.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.pool.yml down -v --remove-orphans
