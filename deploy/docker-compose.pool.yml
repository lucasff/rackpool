# A whole local pool in containers, for trying mediapool out: a coordinator,
# five storage nodes with different limits, and one bridge. Generated by
# scripts/compose-demo.sh, which creates the keys and pool.json under $L.
services:
  coord:
    image: mediapool:latest
    entrypoint: ["mp-coord"]
    volumes: ["./${L}/coord:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment:
      MP_LISTEN: ":7000"
      MP_KEY: /data/coord.key
      MP_CATALOG: /data/catalog.log
      MP_SCORES: /data/scores.json
      MP_FRESH: "true"
      MP_K: "3"
      MP_MAX_N: "6"
      MP_ANCHORED_N: "4"
      MP_ORPHAN_N: "5"
      MP_TARGET_LOSS: "0"
      MP_OFFLINE_AFTER: 10s
      MP_DOWN_AFTER: 30s
      MP_SWARM_CHECK_EVERY: 5s
      MP_TICK: 2s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7000/healthz"]
      interval: 2s
    ports: ["7000:7000"]

  node1: &node
    image: mediapool:latest
    depends_on: { coord: { condition: service_healthy } }
    volumes: ["./${L}/node1:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment: &nodeenv
      MP_ID: node1
      MP_ADDR: http://node1:7100
      MP_COORD: http://coord:7000
      MP_HEARTBEAT: 2s
      MP_REACH: "off"   # everything is on one Docker network here
      MP_RESERVE: "0"
      MP_QUOTA: 500M
      MP_UPLOAD_LIMIT: 400M
      MP_DRAIN: "${DRAIN_node1:-false}"
  node2:
    <<: *node
    volumes: ["./${L}/node2:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment: { <<: *nodeenv, MP_ID: node2, MP_ADDR: http://node2:7100, MP_QUOTA: 2G, MP_UPLOAD_LIMIT: "0", MP_DRAIN: "${DRAIN_node2:-false}" }
  node3:
    <<: *node
    volumes: ["./${L}/node3:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment: { <<: *nodeenv, MP_ID: node3, MP_ADDR: http://node3:7100, MP_QUOTA: 1G, MP_UPLOAD_LIMIT: 100M, MP_DRAIN: "${DRAIN_node3:-false}" }
  node4:
    <<: *node
    volumes: ["./${L}/node4:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment: { <<: *nodeenv, MP_ID: node4, MP_ADDR: http://node4:7100, MP_QUOTA: 1G, MP_DRAIN: "${DRAIN_node4:-false}" }
  node5:
    <<: *node
    volumes: ["./${L}/node5:/data", "./${L}/pool.json:/config/pool.json:ro"]
    environment: { <<: *nodeenv, MP_ID: node5, MP_ADDR: http://node5:7100, MP_QUOTA: 1G, MP_DRAIN: "${DRAIN_node5:-false}" }
  bridge:
    <<: *node
    volumes: ["./${L}/bridge:/data", "./${L}/pool.json:/config/pool.json:ro", "./${L}/swarm:/swarm:ro"]
    environment:
      <<: *nodeenv
      MP_ID: bridge
      MP_ADDR: http://bridge:7100
      MP_QUOTA: 1G
      MP_UPLOAD_LIMIT: "0"
      MP_BRIDGE_MIRROR: /swarm
      MEDIAPOOL_SECRET: ${MEDIAPOOL_SECRET}
